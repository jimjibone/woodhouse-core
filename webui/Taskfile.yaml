version: '3'

tasks:
  default:
    deps:
      - proto-web-v2
      - schema

  proto-web-v2:
    run: when_changed
    sources:
      - ./buf.gen.yaml
      - ../api/proto/v2/**/*.proto
    generates:
      - ./src/lib/api/v2/**/*_pb.ts
    cmds:
      - mkdir -p ./src/lib/api/v2
      - npx buf generate ../api/proto/v2

  schema:
    run: when_changed
    sources:
      - ../api/schema/services.yaml
      - ../api/schema/schema.go
      - ../cmd/webui-schemagen/*.go
    generates:
      - ./src/lib/schema/zz_services.ts
    cmds:
      - go run ../cmd/webui-schemagen -out src/lib/schema/zz_services.ts

  icons:
    cmds:
      - inkscape ../logo/icon-24.svg --export-type=png --export-filename=./static/favicon.png --export-width=24
      - inkscape ../logo/icon-bold.svg --export-type=png --export-filename=./static/favicon-128.png --export-width=128
      - inkscape ../logo/icon-bold.svg --export-type=png --export-filename=./static/favicon-256.png --export-width=256
      - inkscape ../logo/icon-bold.svg --export-type=png --export-filename=./static/favicon-512.png --export-width=512
      - inkscape ../logo/icon-app.svg --export-type=png --export-filename=./static/apple-touch-icon.png --export-width=512

  build:
    deps:
      - proto-web-v2
      - schema
    sources:
      - ./package.json
      - ./package-lock.json
      - ./svelte.config.js
      - ./vite.config.ts
      - ./tsconfig.json
      - ./components.json
      - ./src/**/*
      - ./static/**/*
    generates:
      - ./build/**/*
    cmds:
      - npm run build

  dev:
    deps:
      - proto-web-v2
      - schema
    cmds:
      - npm run dev -- --host
